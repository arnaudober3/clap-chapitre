    <script>
      // Anti-FOUC: apply the persisted theme on <html> before first paint.
      (function () {
        try {
          var pref = localStorage.getItem('cc-theme');
          var dark =
            pref === 'dark' ||
            ((pref === 'auto' || !pref) &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute(
            'data-theme',
            dark ? 'dark' : 'light',
          );
        } catch (e) {}
      })();
    </script>
