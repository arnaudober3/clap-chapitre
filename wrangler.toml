# Matches the Pages project, which is named `clap-chapitre`: `wrangler pages
# deploy` targets whatever name is written here, and would cheerfully create a
# second project under any other one.
name = "clap-chapitre"
compatibility_date = "2026-07-01"

# Cloudflare Pages: `dist/` is served statically, `functions/` becomes the
# routes under /api. No `nodejs_compat` flag — the Functions only use WebCrypto
# and the Fetch API, both standard in the Workers runtime.
pages_build_output_dir = "dist"

# The D1 database. Empty on purpose: the site's content still lives in
# `src/mock/`, and this binding exists so the persistence layer has somewhere to
# land later. `GET /api/db-health` is the only thing reading it today.
#
# Locally only the binding name matters — wrangler keeps the SQLite file under
# `.wrangler/state/v3` (gitignored), shared by `npm run dev` and `preview:cf`.
#
# Preview deployments inherit this block: they read the *same* remote database as
# production. Verified — `/api/db-health` answers 200 on a preview URL. That is
# fine while the database is empty; the day it holds real content, previews need
# their own, declared as `[[env.preview.d1_databases]]` with a second UUID.
[[d1_databases]]
binding = "DB"
database_name = "clap-chapitre"
database_id = "cf7da22f-dfcb-4b6a-a8b2-8dbf5c55ea50"
migrations_dir = "migrations"
